# Results arrive as Server-Sent Events. nginx buffers proxied responses by default,
# which holds the whole reply until it completes and makes the page look frozen.
# proxy_buffering off is not optional here.
server {
    listen 443 ssl http2;
    server_name vrating.example.com;

    # ssl_certificate     /etc/letsencrypt/live/vrating.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vrating.example.com/privkey.pem;

    # A replay POSTs the visitor's own submissions; a busy account runs to a few hundred KB.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;          # required: SSE
        proxy_cache off;
        proxy_read_timeout 900s;      # a cold upsolve scan is long
    }
}
